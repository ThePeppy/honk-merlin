name: merlin

on:
  pull_request:
    branches: [merlin]
  push:
    branches: [merlin]
    tags: ["merlin-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merlin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-be88u:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe stamps honk/version from the merlin-v* tag; a shallow
          # checkout has no tags and the installer would print a bare SHA.
          fetch-depth: 0
      - name: Read Rust toolchain
        id: toolchain
        run: echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
          targets: aarch64-unknown-linux-musl
      - name: boring-sys and zig
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev pkg-config
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1
      - name: Static musl honk-core
        run: sh merlin/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: honk-be88u
          path: merlin/dist/honk-be88u.tar.gz

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Rust toolchain
        id: toolchain
        run: echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt -p honk-dataplane -p honk-core -- --check
      - name: Clippy
        run: |
          cargo clippy -p honk-dataplane --all-targets -- -D warnings
          cargo clippy -p honk-core --all-targets --features redirect -- -D warnings
      - name: Test
        run: |
          cargo test -p honk-dataplane -- --test-threads=8
          cargo test -p honk-core --features redirect --lib -- --test-threads=8 redirect:: userspace_tcp
      - name: Test addon scripts
        run: |
          bash merlin/tests/safety.sh
          python3 merlin/tools/test_surge2honk.py
          python3 merlin/tools/test_fetch_assets.py

  # One rolling release owns the stable download URL. It must stay a
  # prerelease and never "latest", or every addon tag would steal
  # releases/latest from the engine's v* releases.
  release:
    name: GitHub Release (addon)
    needs: [build-be88u, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/merlin-v')
    steps:
      - name: Download the addon tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: honk-be88u
          path: dist
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Write release notes
        env:
          BASE_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Rolling honk addon build for Asuswrt-Merlin on RT-BE88U. Each merlin-v* tag overwrites these assets and moves the merlin tag.\n\nSource tag: `%s`\n\nCommit: `%s`\n\nBuild: %s\n\nInstall over SSH:\n\n```sh\ncd /tmp && rm -rf honk honk.tgz && curl -fsSL -o honk.tgz %s/releases/download/merlin/honk-be88u.tar.gz && tar zxf honk.tgz && sh honk/scripts/install.sh; rc=$?; rm -rf /tmp/honk /tmp/honk.tgz; (exit $rc)\n```\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUN_URL" "$BASE_URL" > notes.md
      - name: Publish the rolling merlin release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: merlin
          name: honk addon for RT-BE88U
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          files: |
            dist/honk-be88u.tar.gz
            dist/SHA256SUMS
          overwrite_files: true
          fail_on_unmatched_files: true
          body_path: notes.md
      # Default checkout keeps GITHUB_TOKEN credentials; the workflow-level
      # permission grant above authorizes this force push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move the rolling merlin tag
        run: git push --force origin "$GITHUB_SHA:refs/tags/merlin"
