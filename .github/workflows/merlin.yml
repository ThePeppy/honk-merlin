name: merlin

on:
  pull_request:
    branches: [merlin]
  push:
    branches: [merlin]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merlin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dataplane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Rust toolchain
        id: toolchain
        run: echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
          targets: aarch64-unknown-linux-musl
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt -p honk-dataplane -- --check
      - name: Clippy
        run: cargo clippy -p honk-dataplane --all-targets -- -D warnings
      - name: Test the dataplane crate
        run: cargo test -p honk-dataplane
      - name: Test addon scripts
        run: |
          bash merlin/tests/safety.sh
          python3 merlin/tools/test_surge2honk.py
      - name: aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Static musl binary
        run: |
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc \
            cargo build -p honk-dataplane --release --target aarch64-unknown-linux-musl
          file target/aarch64-unknown-linux-musl/release/honk-dataplane
          file target/aarch64-unknown-linux-musl/release/honk-dataplane | grep -q 'statically linked'
          sh merlin/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: honk-be88u
          path: merlin/dist/honk-be88u.tar.gz
